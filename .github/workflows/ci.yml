# Inspectra CI: every push and pull request is installed from scratch, linted, type-checked,
# tested (unit + integration against a real Postgres) and built.

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway database for the integration suite; apps/api/test/global-setup.ts creates
      # and migrates `inspectra_test` inside it.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inspectra
          POSTGRES_PASSWORD: inspectra
          POSTGRES_DB: inspectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspectra -d inspectra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://inspectra:inspectra@localhost:5432/inspectra_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # Also runs the API's postinstall, which generates the Prisma client.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Prisma schema
        run: pnpm --filter @inspectra/api exec prisma validate

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
