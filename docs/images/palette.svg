<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Inspectra colour palette: ten neutral greys, four status colours with their soft backgrounds, and example status labels">
  <style>
    text { font-family: Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #6b6b6b; }
    .name { font-size: 14px; font-weight: 600; }
    .hex { font-size: 12px; font-variant-numeric: tabular-nums; }
    .label { font-size: 14px; font-weight: 500; fill: #3d3d3d; }
  </style>

  <!-- Page -->
  <rect width="1200" height="600" rx="24" fill="#efefef"/>

  <!-- Header -->
  <text x="64" y="66" class="eyebrow">INSPECTRA · DESIGN SYSTEM</text>
  <text x="64" y="104" font-size="30" font-weight="300" fill="#141414" letter-spacing="-0.5">Monochrome by default. Colour only means status.</text>

  <!-- Neutrals -->
  <text x="64" y="150" class="eyebrow">NEUTRALS</text>
  <g transform="translate(64 164)">
    <rect x="0"   width="100" height="120" rx="14" fill="#f7f7f7" stroke="#d4d4d4"/>
    <rect x="108" width="100" height="120" rx="14" fill="#efefef" stroke="#d4d4d4"/>
    <rect x="216" width="100" height="120" rx="14" fill="#e6e6e6"/>
    <rect x="324" width="100" height="120" rx="14" fill="#d4d4d4"/>
    <rect x="432" width="100" height="120" rx="14" fill="#a3a3a3"/>
    <rect x="540" width="100" height="120" rx="14" fill="#6b6b6b"/>
    <rect x="648" width="100" height="120" rx="14" fill="#525252"/>
    <rect x="756" width="100" height="120" rx="14" fill="#3d3d3d"/>
    <rect x="864" width="100" height="120" rx="14" fill="#262626"/>
    <rect x="972" width="100" height="120" rx="14" fill="#141414"/>

    <g fill="#141414">
      <text x="14"  y="88" class="name">50</text>  <text x="14"  y="106" class="hex">#F7F7F7</text>
      <text x="122" y="88" class="name">100</text> <text x="122" y="106" class="hex">#EFEFEF</text>
      <text x="230" y="88" class="name">200</text> <text x="230" y="106" class="hex">#E6E6E6</text>
      <text x="338" y="88" class="name">300</text> <text x="338" y="106" class="hex">#D4D4D4</text>
      <text x="446" y="88" class="name">400</text> <text x="446" y="106" class="hex">#A3A3A3</text>
    </g>
    <g fill="#ffffff">
      <text x="554" y="88" class="name">500</text> <text x="554" y="106" class="hex">#6B6B6B</text>
      <text x="662" y="88" class="name">600</text> <text x="662" y="106" class="hex">#525252</text>
      <text x="770" y="88" class="name">700</text> <text x="770" y="106" class="hex">#3D3D3D</text>
      <text x="878" y="88" class="name">800</text> <text x="878" y="106" class="hex">#262626</text>
      <text x="986" y="88" class="name">900</text> <text x="986" y="106" class="hex">#141414</text>
    </g>
    <text x="122" y="28" class="hex" fill="#6b6b6b">Page</text>
    <text x="986" y="28" class="hex" fill="#a3a3a3">Ink</text>
  </g>

  <!-- Status colours -->
  <text x="64" y="326" class="eyebrow">STATUS</text>
  <g transform="translate(64 340)">
    <g>
      <rect width="256" height="112" rx="16" fill="#fdecec"/>
      <circle cx="28" cy="32" r="8" fill="#d93036"/>
      <text x="46" y="37" class="name" fill="#141414">Danger</text>
      <text x="20" y="72" class="hex" fill="#3d3d3d">#D93036 on #FDECEC</text>
      <text x="20" y="94" class="hex" fill="#6b6b6b">Overdue · Fail · Open issue</text>
    </g>
    <g transform="translate(272 0)">
      <rect width="256" height="112" rx="16" fill="#fdf3e2"/>
      <circle cx="28" cy="32" r="8" fill="#d98a0b"/>
      <text x="46" y="37" class="name" fill="#141414">Caution</text>
      <text x="20" y="72" class="hex" fill="#3d3d3d">#D98A0B on #FDF3E2</text>
      <text x="20" y="94" class="hex" fill="#6b6b6b">In progress · In work · Medium</text>
    </g>
    <g transform="translate(544 0)">
      <rect width="256" height="112" rx="16" fill="#e3f8e8"/>
      <circle cx="28" cy="32" r="8" fill="#1e8c48"/>
      <text x="46" y="37" class="name" fill="#141414">Safe</text>
      <text x="20" y="72" class="hex" fill="#3d3d3d">#1E8C48 on #E3F8E8</text>
      <text x="20" y="94" class="hex" fill="#6b6b6b">Verified · Pass · Active</text>
    </g>
    <g transform="translate(816 0)">
      <rect width="256" height="112" rx="16" fill="#ffffff" stroke="#e6e6e6"/>
      <circle cx="28" cy="32" r="8" fill="#141414"/>
      <text x="46" y="37" class="name" fill="#141414">Info</text>
      <text x="20" y="72" class="hex" fill="#3d3d3d">#141414 on #EFEFEF</text>
      <text x="20" y="94" class="hex" fill="#6b6b6b">Due · Open work order</text>
    </g>
  </g>

  <!-- Status labels -->
  <text x="64" y="490" class="eyebrow">STATUS LABELS · ALWAYS A DOT PLUS TEXT</text>
  <g transform="translate(64 504)">
    <rect width="1072" height="60" rx="16" fill="#ffffff" stroke="#e6e6e6"/>
    <g transform="translate(24 30)">
      <circle cx="4" cy="0" r="4" fill="#141414"/>
      <text x="14" y="5" class="label">Due</text>

      <circle cx="84" cy="0" r="4" fill="#d93036"/>
      <text x="94" y="5" class="label">Overdue</text>

      <circle cx="194" cy="0" r="4" fill="#d98a0b"/>
      <text x="204" y="5" class="label">In progress</text>

      <circle cx="320" cy="0" r="3.25" fill="none" stroke="#141414" stroke-width="1.5"/>
      <text x="330" y="5" class="label">Awaiting verification</text>

      <circle cx="510" cy="0" r="4" fill="#1e8c48"/>
      <text x="520" y="5" class="label">Verified</text>

      <circle cx="610" cy="0" r="4" fill="#a3a3a3"/>
      <text x="620" y="5" class="label">Low</text>

      <circle cx="684" cy="0" r="4" fill="#d93036"/>
      <text x="694" y="5" class="label">High</text>

      <rect x="760" y="-12" width="70" height="24" rx="12" fill="#d93036"/>
      <text x="773" y="5" font-size="13" font-weight="600" fill="#ffffff">Critical</text>

      <text x="862" y="5" class="hex" fill="#6b6b6b">Hollow = done, not checked</text>
    </g>
  </g>
</svg>
