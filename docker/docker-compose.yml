# Inspectra: the whole stack in containers.
#
#   docker compose -f docker/docker-compose.yml up --build      # everything, then open http://localhost:3000
#   docker compose -f docker/docker-compose.yml up -d postgres redis   # just the infrastructure, for `pnpm dev`
#   docker compose -f docker/docker-compose.yml down             # stop (keeps data)
#   docker compose -f docker/docker-compose.yml down -v          # stop and wipe the database
#
# From the repo root the same commands are available as `pnpm docker:up`, `pnpm docker:down`, `pnpm infra:up`.

name: inspectra

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inspectra
      POSTGRES_PASSWORD: inspectra
      POSTGRES_DB: inspectra
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data in a versioned subfolder of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inspectra -d inspectra']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://inspectra:inspectra@postgres:5432/inspectra
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      AUTH_MODE: demo
      # Creates the demo organizations on first start; a no-op afterwards.
      SEED_DEMO: 'true'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
